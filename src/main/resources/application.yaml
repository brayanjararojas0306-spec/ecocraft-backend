server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3308/ecocraft_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true

  sql:
    init:
      mode: always